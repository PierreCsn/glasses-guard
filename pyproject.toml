[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glasses-guard"
version = "0.1.0"
description = "Privacy-first local reminder that checks whether glasses appear to be worn."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.3,<2",
  "numpy>=1.26,<3",
  "opencv-python>=4.9,<5",
  "scikit-image>=0.22,<1",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
glasses-guard-capture = "glasses_guard.capture:main"
glasses-guard-train = "glasses_guard.train:main"
glasses-guard-monitor = "glasses_guard.monitor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
